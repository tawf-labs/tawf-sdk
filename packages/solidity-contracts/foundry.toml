[profile.default]
src = "contracts"
out = "artifacts/foundry"
libs = ["node_modules", "lib"]
solc_version = "0.8.20"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
verbosity = 3

# Test configuration
fuzz = { runs = 256 }
invariant = { runs = 1000, depth = 50 }

[profile.test]
fuzz = { runs = 1000 }
invariant = { runs = 10000, depth = 100 }

# Gas snapshots
[profile.snapshot]
skip = "test/invariant"

# See more config options https://github.com/foundry-rs/foundry/tree/master/config
